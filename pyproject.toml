[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scicite-claims"
version = "0.1.0"
description = "Citation-aware claim extraction for scientific text — regex patterns + spaCy."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "David Burton", email = "david@databurton.com"}]
keywords = ["nlp", "claims", "citations", "scientific", "spacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["spacy>=3.7"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8,<2.0",
]

[project.urls]
Homepage = "https://github.com/Burton-David/scicite-claims"
"Bug Tracker" = "https://github.com/Burton-David/scicite-claims/issues"

[tool.setuptools.packages.find]
include = ["scicite_claims*"]

[tool.setuptools.package-data]
scicite_claims = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "PIE"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["spacy", "spacy.*"]
ignore_missing_imports = true

# numpy ships PEP 695 `type` statements in its stubs, which mypy refuses to
# parse while python_version targets anything below 3.12. numpy arrives here
# transitively through spaCy and is not part of this package's public surface,
# so skip its stubs rather than raise the target version and stop checking 3.11.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
